{{define "header"}}
<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="quick-info-bar" role="banner">
  <strong>Sundays:</strong> {{.Config.BibleClass}} &amp; {{.Config.Worship}}
  <span aria-hidden="true">|</span>
  <a href="https://www.google.com/maps/dir/?api=1&destination={{.Config.Latitude}},{{.Config.Longitude}}" target="_blank" rel="noopener" aria-label="Get directions to {{.Config.Address}}">Get Directions</a>
  <span aria-hidden="true">|</span>
  <a href="tel:{{.Config.Phone}}" aria-label="Call us at {{.Config.Phone}}">{{.Config.Phone}}</a>
</div>

<header class="site-header">
  <nav class="nav-container" aria-label="Main navigation">
    <a href="/" class="logo" aria-label="{{.Config.Title}} - Home">
      <picture>
        <source type="image/webp" srcset="{{asset "images/logo-main.webp"}}">
        <img src="{{asset "images/logo-main.png"}}" alt="South Hills Church of Christ" width="469" height="100">
      </picture>
      <span class="sr-only">South Hills Church of Christ</span>
    </a>

    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu">
      <span class="hamburger" aria-hidden="true"></span>
    </button>

    <ul class="nav-menu" id="main-menu" role="menubar">
      {{range .MenuItems}}
        <li class="nav-item" role="none">
          <a href="{{.URL}}"
             role="menuitem"
             class="nav-link{{if eq $.CurrentPath .URL}} active{{end}}"
             {{if eq $.CurrentPath .URL}}aria-current="page"{{end}}>
            {{.Name}}
          </a>
        </li>
      {{end}}
    </ul>
  </nav>
</header>
<script>
(function() {
  var toggle = document.querySelector('.nav-toggle');
  var menu = document.getElementById('main-menu');
  if (!toggle || !menu) return;

  function closeMenu() {
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Open menu');
    menu.classList.remove('active');
  }

  toggle.addEventListener('click', function() {
    var expanded = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', String(!expanded));
    this.setAttribute('aria-label', expanded ? 'Open menu' : 'Close menu');
    menu.classList.toggle('active');
  });

  // Close menu when a nav link is clicked
  menu.querySelectorAll('.nav-link').forEach(function(link) {
    link.addEventListener('click', closeMenu);
  });
})();
</script>
{{end}}
