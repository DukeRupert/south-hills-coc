{{define "header"}}
<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="quick-info-bar" role="banner">
  <strong>Sundays:</strong> {{.Config.BibleClass}} &amp; {{.Config.Worship}}
  <span aria-hidden="true">|</span>
  <a href="tel:{{.Config.Phone}}" aria-label="Call us at {{.Config.Phone}}">{{.Config.Phone}}</a>
</div>

<header class="site-header">
  <nav class="nav-container" aria-label="Main navigation">
    <a href="/" class="logo" aria-label="{{.Config.Title}} - Home">
      <picture>
        <source type="image/webp" srcset="/static/images/logo-main.webp">
        <img src="/static/images/logo-main.png" alt="South Hills Church of Christ" width="469" height="100">
      </picture>
      <span class="sr-only">South Hills Church of Christ</span>
    </a>

    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu" onclick="const expanded = this.getAttribute('aria-expanded') === 'true'; this.setAttribute('aria-expanded', !expanded); this.setAttribute('aria-label', expanded ? 'Open menu' : 'Close menu'); document.getElementById('main-menu').classList.toggle('active');">
      <span class="hamburger" aria-hidden="true"></span>
    </button>

    <ul class="nav-menu" id="main-menu" role="menubar">
      {{range .MenuItems}}
        <li class="nav-item" role="none">
          <a href="{{.URL}}"
             role="menuitem"
             class="nav-link{{if eq $.CurrentPath .URL}} active{{end}}"
             {{if eq $.CurrentPath .URL}}aria-current="page"{{end}}>
            {{.Name}}
          </a>
        </li>
      {{end}}
    </ul>
  </nav>
</header>
{{end}}
