{{define "calendar-grid"}}
<div id="{{if .ShowToggle}}events-view{{else}}calendar-grid{{end}}">
  <!-- Month navigation -->
  <div class="{{if .ShowToggle}}events-toolbar{{end}}">
    <div class="calendar-nav">
      <button
        class="btn calendar-nav-btn"
        hx-get="/calendar/events?month={{.PrevMonth}}{{if .ShowToggle}}&toggle=1{{end}}"
        hx-target="#{{if .ShowToggle}}events-view{{else}}calendar-grid{{end}}"
        hx-swap="outerHTML">
        &larr; Prev
      </button>
      <h2 class="calendar-month-label">{{.MonthLabel}}</h2>
      <button
        class="btn calendar-nav-btn"
        hx-get="/calendar/events?month={{.NextMonth}}{{if .ShowToggle}}&toggle=1{{end}}"
        hx-target="#{{if .ShowToggle}}events-view{{else}}calendar-grid{{end}}"
        hx-swap="outerHTML">
        Next &rarr;
      </button>
    </div>
    {{if .ShowToggle}}
    <div class="view-toggle">
      <button class="view-toggle-btn"
              hx-get="/calendar/feed?month={{.CurrentMonth}}"
              hx-target="#events-view"
              hx-swap="outerHTML">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        List
      </button>
      <button class="view-toggle-btn view-toggle-btn-active" disabled aria-current="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </button>
    </div>
    {{end}}
  </div>

  <!-- Legend -->
  <div class="calendar-legend">
    <span class="calendar-legend-item"><span class="calendar-legend-dot calendar-dot-sanctuary"></span> Sanctuary</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot calendar-dot-lower"></span> Lower Hall</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot calendar-dot-loft"></span> Loft</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot calendar-dot-all"></span> Entire Building</span>
  </div>

  <!-- Grid -->
  <div class="calendar-grid">
    {{range .DayHeaders}}
    <div class="calendar-header-cell">{{.}}</div>
    {{end}}

    {{range .Days}}
    <div class="calendar-day-cell{{if .IsToday}} calendar-today{{end}}{{if not .InMonth}} calendar-out-of-month{{end}}"
         {{if .InMonth}}aria-label="{{.Day}}, {{$.MonthLabel}}{{if .Events}}, {{len .Events}} event{{if gt (len .Events) 1}}s{{end}}{{end}}"{{end}}>
      <span class="calendar-day-number{{if .IsToday}} calendar-day-today{{end}}">{{.Day}}</span>
      {{range .Events}}
      <div class="calendar-event calendar-event-{{.Space}}" title="{{.Summary}} ({{.TimeRange}})">
        <span class="calendar-event-summary">{{.Summary}}</span>
      </div>
      {{end}}
    </div>
    {{end}}
  </div>
</div>
{{end}}
