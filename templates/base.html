{{define "base"}}
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Primary Meta Tags -->
  <title>{{if .IsHome}}{{.Config.Title}} | Helena, MT | Sunday Worship 10:30 AM{{else}}{{.Title}} | {{.Config.Title}}{{end}}</title>
  <meta name="description" content="{{if .Description}}{{.Description}}{{else}}{{.Config.Description}}{{end}}">
  <meta name="keywords" content="church Helena Montana, Church of Christ Helena, Helena MT church, Christian church Helena, Sunday worship Helena MT, Bible study Helena Montana">
  <meta name="author" content="{{.Config.Title}}">

  <!-- Geo Tags for Local SEO -->
  <meta name="geo.region" content="US-MT">
  <meta name="geo.placename" content="Helena">
  <meta name="geo.position" content="{{.Config.Latitude}};{{.Config.Longitude}}">
  <meta name="ICBM" content="{{.Config.Latitude}}, {{.Config.Longitude}}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{{if .IsHome}}website{{else}}article{{end}}">
  <meta property="og:url" content="{{.Config.BaseURL}}{{if not .IsHome}}{{slice .CurrentPath 1}}{{end}}">
  <meta property="og:title" content="{{if .IsHome}}{{.Config.Title}} | Helena, MT | Sunday Worship 10:30 AM{{else}}{{.Title}} | {{.Config.Title}}{{end}}">
  <meta property="og:description" content="{{if .Description}}{{.Description}}{{else}}{{.Config.Description}}{{end}}">
  <meta property="og:image" content="{{.Config.BaseURL}}static/images/og-image.jpg">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="{{.Config.Title}}">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{if .IsHome}}{{.Config.Title}} | Helena, MT | Sunday Worship 10:30 AM{{else}}{{.Title}} | {{.Config.Title}}{{end}}">
  <meta name="twitter:description" content="{{if .Description}}{{.Description}}{{else}}{{.Config.Description}}{{end}}">
  <meta name="twitter:image" content="{{.Config.BaseURL}}static/images/og-image.jpg">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{.Config.BaseURL}}{{if not .IsHome}}{{slice .CurrentPath 1}}{{end}}">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{asset "favicon.ico"}}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{asset "images/favicon-192.png"}}">
  <link rel="apple-touch-icon" href="{{asset "images/apple-touch-icon.png"}}">

  <!-- Styles -->
  <link rel="stylesheet" href="{{asset "css/main.css"}}">

  <!-- Google Fonts: async load to avoid render blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"></noscript>

  <!-- Schema.org Structured Data -->
  {{template "schema" .}}

  <!-- Analytics -->
  <script defer data-domain="southhillscoc.org" src="https://plausible.angmar.dev/js/script.js"></script>

  {{block "head" .}}{{end}}
</head>
<body>
  {{template "header" .}}

  <main id="main-content" tabindex="-1">
    {{block "content" .}}{{end}}
  </main>

  {{template "footer" .}}

  {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
