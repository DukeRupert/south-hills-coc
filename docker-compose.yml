services:
  web:
    image: ${DOCKER_IMAGE:-southhillscoc:latest}
    build: .
    ports:
      - "${LISTEN_PORT:-8082}:80"
    environment:
      - PORT=80
      - API_PORT=8080
      - POSTMARK_TOKEN=${POSTMARK_TOKEN}
      - FROM_EMAIL=${FROM_EMAIL}
      - TO_EMAIL=${TO_EMAIL}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://www.southhillscoc.com}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
    restart: unless-stopped
