{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
</div>

<section class="section">
  <div class="container">
    {{ .Content }}

    {{ if .Pages }}
    <div class="card-grid">
      {{ range .Pages }}
      <a href="{{ .Permalink }}" class="card">
        <div class="card-content">
          <h3>{{ .Title }}</h3>
          {{ with .Description }}<p>{{ . }}</p>{{ end }}
        </div>
      </a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
